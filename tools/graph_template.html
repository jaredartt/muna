<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muna map</title>
<style>
  :root { --bg:#fdf7eb; --card:#fff; --ink:#53535c; --muted:#8e8f9e; --line:#e9dfca; --coral:#e37b58; --shadow:0 6px 24px rgba(120,90,40,.10); }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1815; --card:#26221e; --ink:#efeae2; --muted:#a8a196; --line:#3a352f; --shadow:0 6px 24px rgba(0,0,0,.35); } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: 'Quicksand', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; touch-action:none; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  svg { width:100%; height:100%; display:block; }
  .top { position:fixed; left:12px; right:12px; top:calc(env(safe-area-inset-top) + 10px); display:flex; gap:10px; align-items:center; flex-wrap:wrap; pointer-events:none; }
  .top > * { pointer-events:auto; }
  .title { background:var(--card); box-shadow:var(--shadow); border-radius:18px; padding:8px 14px; font-weight:700; }
  .title small { color:var(--muted); font-weight:500; margin-left:6px; }
  input[type=search] { background:var(--card); box-shadow:var(--shadow); border:0; border-radius:18px; padding:10px 14px; font:inherit; color:inherit; min-width:150px; flex:1; max-width:260px; outline:none; }
  .legend { position:fixed; left:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); display:flex; flex-wrap:wrap; gap:6px; max-width:calc(100vw - 24px); }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--card); box-shadow:var(--shadow); border-radius:999px; padding:6px 11px; font-size:13px; font-weight:600; cursor:pointer; user-select:none; }
  .chip i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .chip.off { opacity:.4; }
  .zoom { position:fixed; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px); display:flex; flex-direction:column; gap:6px; }
  .zoom button { width:40px; height:40px; border-radius:14px; border:0; background:var(--card); box-shadow:var(--shadow); font:inherit; font-size:20px; font-weight:700; color:var(--ink); cursor:pointer; }
  #panel { position:fixed; right:12px; top:calc(env(safe-area-inset-top) + 64px); width:min(320px, calc(100vw - 24px)); max-height:calc(100dvh - 190px); overflow:auto; background:var(--card); box-shadow:var(--shadow); border-radius:22px; padding:16px; display:none; }
  #panel h3 { margin:0 0 2px; font-size:18px; }
  #panel .path { color:var(--muted); font-size:12px; word-break:break-all; margin-bottom:10px; }
  #panel h4 { margin:12px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  #panel .tags { display:flex; flex-wrap:wrap; gap:5px; }
  #panel .tag { background:var(--bg); border-radius:999px; padding:3px 9px; font-size:12.5px; cursor:pointer; }
  #panel .tag.plain { cursor:default; }
  #panel .x { position:absolute; right:10px; top:8px; border:0; background:none; font-size:20px; color:var(--muted); cursor:pointer; }
  .link { stroke:var(--muted); stroke-opacity:.28; fill:none; }
  .link.hot { stroke:var(--coral); stroke-opacity:.95; }
  .dim { opacity:.12; }
  text { font-size:11px; fill:var(--ink); paint-order:stroke; stroke:var(--bg); stroke-width:3px; pointer-events:none; font-weight:600; }
</style>
</head>
<body>
<div id="stage"><svg id="svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e8f9e" opacity=".6"/></marker><marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e37b58"/></marker></defs><g id="world"><g id="links"></g><g id="nodes"></g></g></svg></div>
<div class="top"><div class="title">Muna map<small id="count"></small></div><input id="q" type="search" placeholder="Search a file, table…"></div>
<div id="panel"></div>
<div class="legend" id="legend"></div>
<div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit" style="font-size:14px">fit</button></div>
<script>
const DATA = /*DATA*/null;
const GROUPS = {
  pages:['Screens','#e37b58'], components:['Components','#6d8cf9'], context:['Context','#9b7fd6'], hooks:['Hooks','#2ad17b'],
  lib:['Helpers (lib)','#ef994e'], data:['Data','#d4b83e'], app:['App','#8e8f9e'],
  server:['Server functions','#53535c'], database:['Database tables','#d9547a'], rpc:['Database functions','#b79be6']
};
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const nodes = DATA.nodes.map((n) => ({ ...n, x: 0, y: 0, vx: 0, vy: 0, ins: [], outs: [], on: true }));
const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
const links = DATA.links.map((l) => ({ ...l, a: byId[l.s], b: byId[l.t] }));
links.forEach((l) => { l.a.outs.push(l.b); l.b.ins.push(l.a); });
nodes.forEach((n) => { n.r = (n.group === 'server' ? 15 : 6) + Math.sqrt(n.ins.length) * 3.2 + Math.min(8, n.lines / 150); });
$('count').textContent = nodes.length + ' things · ' + links.length + ' links';

// start positions: each group gets its own spot on a big circle
const gkeys = Object.keys(GROUPS).filter((g) => nodes.some((n) => n.group === g));
const R = 420;
const anchor = {}; gkeys.forEach((g, i) => { const a = (i / gkeys.length) * Math.PI * 2 - Math.PI / 2; anchor[g] = { x: Math.cos(a) * R, y: Math.sin(a) * R * 0.8 }; });
nodes.forEach((n, i) => { const c = anchor[n.group] || { x: 0, y: 0 }; n.x = c.x + Math.cos(i) * 60; n.y = c.y + Math.sin(i * 1.7) * 60; });

// ---- drawing ----
const gl = $('links'), gn = $('nodes');
links.forEach((l) => { l.el = document.createElementNS(NS, 'line'); l.el.setAttribute('class', 'link'); l.el.setAttribute('marker-end', 'url(#arrow)'); gl.appendChild(l.el); });
nodes.forEach((n) => {
  const g = document.createElementNS(NS, 'g'); n.el = g; g.style.cursor = 'pointer';
  const col = GROUPS[n.group] ? GROUPS[n.group][1] : '#8e8f9e';
  let shape;
  if (n.group === 'database') { shape = document.createElementNS(NS, 'rect'); shape.setAttribute('x', -n.r); shape.setAttribute('y', -n.r); shape.setAttribute('width', n.r * 2); shape.setAttribute('height', n.r * 2); shape.setAttribute('rx', 5); }
  else if (n.group === 'server') { shape = document.createElementNS(NS, 'path'); shape.setAttribute('d', `M0 ${-n.r}L${n.r} 0L0 ${n.r}L${-n.r} 0Z`); }
  else { shape = document.createElementNS(NS, 'circle'); shape.setAttribute('r', n.r); }
  shape.setAttribute('fill', col); shape.setAttribute('stroke', 'var(--bg)'); shape.setAttribute('stroke-width', 2);
  const t = document.createElementNS(NS, 'text'); t.textContent = n.label; t.setAttribute('y', n.r + 12); t.setAttribute('text-anchor', 'middle'); n.text = t;
  g.appendChild(shape); g.appendChild(t); gn.appendChild(g);
});

// ---- physics ----
let alpha = 1;
function step() {
  const live = nodes.filter((n) => n.on);
  for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], b = live[j]; let dx = b.x - a.x, dy = b.y - a.y; let d2 = dx * dx + dy * dy + 0.01; const min = (a.r + b.r + 26);
    if (d2 > 90000) continue; const d = Math.sqrt(d2); const f = (min * min * 0.9) / d2 * alpha * 0.9 + (d < min ? (min - d) * 0.05 : 0);
    dx /= d; dy /= d; a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
  }
  for (const l of links) { if (!l.a.on || !l.b.on) continue; let dx = l.b.x - l.a.x, dy = l.b.y - l.a.y; const d = Math.sqrt(dx * dx + dy * dy) + 0.01; const f = (d - (70 + l.a.r + l.b.r)) * 0.012 * alpha; dx /= d; dy /= d; l.a.vx += dx * f; l.a.vy += dy * f; l.b.vx -= dx * f; l.b.vy -= dy * f; }
  for (const n of live) { const c = anchor[n.group] || { x: 0, y: 0 }; n.vx += (c.x - n.x) * 0.0035 * alpha; n.vy += (c.y - n.y) * 0.0035 * alpha; n.vx -= n.x * 0.0006; n.vy -= n.y * 0.0006;
    if (n.fixed) { n.vx = n.vy = 0; continue; } n.x += n.vx; n.y += n.vy; n.vx *= 0.82; n.vy *= 0.82; }
  alpha *= 0.992; if (alpha < 0.02) alpha = 0;
}
let hover = null, sel = null, query = '';
// ---- camera ----
let cam = { x: innerWidth / 2, y: innerHeight / 2, k: 0.7 };
function render() {
  $('world').setAttribute('transform', `translate(${cam.x} ${cam.y}) scale(${cam.k})`);
  for (const l of links) { const vis = l.a.on && l.b.on; l.el.style.display = vis ? '' : 'none'; if (!vis) continue;
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    l.el.setAttribute('x1', l.a.x + dx / d * l.a.r); l.el.setAttribute('y1', l.a.y + dy / d * l.a.r); l.el.setAttribute('x2', l.b.x - dx / d * (l.b.r + 2)); l.el.setAttribute('y2', l.b.y - dy / d * (l.b.r + 2)); }
  for (const n of nodes) { n.el.style.display = n.on ? '' : 'none'; n.el.setAttribute('transform', `translate(${n.x} ${n.y})`);
    const show = n.r > 11 || cam.k > 1.3 || n === sel || (hover && (n === hover || hover.ins.includes(n) || hover.outs.includes(n))) || (sel && (sel.ins.includes(n) || sel.outs.includes(n))) || (query && match(n));
    n.text.style.display = show ? '' : 'none'; }
}
function fit() {
  const live = nodes.filter((n) => n.on); if (!live.length) return;
  const xs = live.map((n) => n.x), ys = live.map((n) => n.y); const x0 = Math.min(...xs) - 60, x1 = Math.max(...xs) + 60, y0 = Math.min(...ys) - 60, y1 = Math.max(...ys) + 60;
  cam.k = Math.min(innerWidth / (x1 - x0), (innerHeight - 140) / (y1 - y0), 1.6); cam.x = innerWidth / 2 - ((x0 + x1) / 2) * cam.k; cam.y = innerHeight / 2 - ((y0 + y1) / 2) * cam.k + 10;
}
for (let i = 0; i < 260; i++) step(); fit();
(function loop() { if (alpha > 0) step(); render(); requestAnimationFrame(loop); })();

// ---- highlight ----
const match = (n) => (n.label + ' ' + n.path).toLowerCase().includes(query);
function paint() {
  const focus = sel || hover;
  for (const l of links) { const hot = focus && (l.a === focus || l.b === focus); l.el.setAttribute('class', 'link' + (hot ? ' hot' : '') + (focus && !hot ? ' dim' : '')); l.el.setAttribute('marker-end', hot ? 'url(#arrowHot)' : 'url(#arrow)'); }
  for (const n of nodes) { const near = focus && (n === focus || focus.ins.includes(n) || focus.outs.includes(n)); const q = query && !match(n); n.el.setAttribute('class', (focus && !near) || q ? 'dim' : ''); }
}
$('q').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); paint(); });

// ---- panel ----
function tag(n) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = n.label; s.onclick = () => select(n); return s; }
function select(n) {
  sel = n; paint(); const p = $('panel'); p.style.display = n ? 'block' : 'none'; if (!n) return; p.innerHTML = '';
  const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.onclick = () => select(null); p.appendChild(x);
  p.insertAdjacentHTML('beforeend', `<h3>${n.label}</h3><div class="path">${GROUPS[n.group] ? GROUPS[n.group][0] : n.group}${n.path ? ' · ' + n.path : ''}${n.lines ? ' · ' + n.lines + ' lines' : ''}</div>`);
  const sect = (title, arr, fn) => { if (!arr.length) return; const h = document.createElement('h4'); h.textContent = title; const w = document.createElement('div'); w.className = 'tags'; arr.forEach((a) => w.appendChild(fn(a))); p.appendChild(h); p.appendChild(w); };
  sect('Gives (exports)', n.exports, (e) => { const s = document.createElement('span'); s.className = 'tag plain'; s.textContent = e; return s; });
  sect('Uses (' + n.outs.length + ')', n.outs, tag);
  sect('Used by (' + n.ins.length + ')', n.ins, tag);
}

// ---- pointer: drag nodes, pan, zoom ----
const stage = $('stage'); const pts = new Map(); let dragNode = null, panning = false, last = null, moved = 0, pinch = 0;
const world = (e) => ({ x: (e.clientX - cam.x) / cam.k, y: (e.clientY - cam.y) / cam.k });
function nodeAt(t) { let el = t; while (el && el !== stage) { const n = nodes.find((m) => m.el === el); if (n) return n; el = el.parentNode; } return null; }
stage.addEventListener('pointerdown', (e) => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); moved = 0; last = { x: e.clientX, y: e.clientY };
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); dragNode = null; panning = false; return; }
  dragNode = nodeAt(e.target); if (dragNode) { dragNode.fixed = true; alpha = Math.max(alpha, 0.25); } else { panning = true; stage.classList.add('dragging'); } });
stage.addEventListener('pointermove', (e) => {
  if (pts.has(e.pointerId)) pts.set(e.pointerId, e);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinch) zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, d / pinch); pinch = d; return; }
  if (dragNode && last) { const w = world(e); dragNode.x = w.x; dragNode.y = w.y; alpha = Math.max(alpha, 0.15); moved += 1; }
  else if (panning && last) { cam.x += e.clientX - last.x; cam.y += e.clientY - last.y; moved += Math.abs(e.clientX - last.x) + Math.abs(e.clientY - last.y); }
  else if (!pts.size || e.pointerType === 'mouse') { const n = nodeAt(e.target); if (n !== hover) { hover = n; paint(); } }
  last = { x: e.clientX, y: e.clientY }; });
function up(e) { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0;
  if (dragNode) { dragNode.fixed = false; if (moved < 4) select(dragNode === sel ? null : dragNode); }
  else if (panning && moved < 4) select(null);
  dragNode = null; panning = false; stage.classList.remove('dragging'); }
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
function zoomAt(cx, cy, f) { const k = Math.min(4, Math.max(0.15, cam.k * f)); cam.x = cx - (cx - cam.x) * (k / cam.k); cam.y = cy - (cy - cam.y) * (k / cam.k); cam.k = k; }
stage.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
$('zin').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1.3); $('zout').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.3); $('zfit').onclick = fit;

// ---- legend: tap a colour to hide / show that kind ----
const lg = $('legend');
gkeys.forEach((g) => { const c = document.createElement('span'); c.className = 'chip'; c.innerHTML = `<i style="background:${GROUPS[g][1]}"></i>${GROUPS[g][0]} <small style="color:var(--muted)">${nodes.filter((n) => n.group === g).length}</small>`;
  c.onclick = () => { const off = !c.classList.contains('off'); c.classList.toggle('off', off); nodes.filter((n) => n.group === g).forEach((n) => (n.on = !off)); alpha = Math.max(alpha, 0.3); }; lg.appendChild(c); });
</script>
</body>
</html>
